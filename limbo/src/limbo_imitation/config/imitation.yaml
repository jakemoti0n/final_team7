# 모방 학습 1일 차: 명령 중재기와 바퀴 기록기. mode·driver·note는 런치 인자가 덮어쓴다.
drive_arbiter:
  ros__parameters:
    mode: nav                  # manual | policy_assist | policy | nav. nav = 중재기 넣기 전과 같은 동작이라 기본
    teleop_topic: /cmd_vel_teleop
    policy_topic: /cmd_vel_policy
    nav_topic: /cmd_vel_smoothed       # velocity_smoother 출력(실물 배선 그대로)
    joy_topic: /joy
    policy_status_topic: /policy/status
    odom_topic: /odom
    cmd_vel_out_topic: /cmd_vel_arbiter   # collision_monitor 입력. 바퀴로 가는 길에 안전 정지가 늘 남게
    drive_mode_topic: /drive_mode
    deadman_button: 4          # LB. joy_xbox.yaml의 enable_button과 같은 버튼
    require_deadman: true      # manual에서 데드맨 필요. 키보드 운전(데드맨 없음) 때만 false: teleop 명령이 신선한 동안 통과.
                               #   조이스틱이 없을 때의 대안이고 안전 정지는 collision_monitor가 그대로 맡는다
    command_timeout: 0.5       # s. roboclaw_drive 보드 명령 timeout과 같다. 이보다 오래된 명령으로 계속 달리지 않게
    stuck_speed: 0.05          # m/s. odom 속도가 이보다 느리면 "안 움직임"
    stuck_timeout: 3.0         # s. 갇힘 판정 안전망. Nav2 진전 검사(10 s)보다 먼저, 사람 기다리기 판정(2 s)보다 늦게
    publish_rate: 20.0         # Hz. MPPI 제어 주기와 같게 해 nav 명령을 한 틱도 늦추지 않게

run_recorder:
  ros__parameters:
    mode: manual               # 폴더 이름·meta.json에 남는 모드. 런치가 중재기와 같은 값을 준다
    driver: ''                 # 운전자 이름. 사람마다 운전 버릇이 달라 학습 데이터를 거를 때 쓴다
    note: ''
    waypoints_file: ''         # 경유점 yaml. meta.json에 sha256을 남겨 어느 판으로 달렸는지 안다
    map_yaml: ''
    model_file: ''             # 정책 모델 파일. manual·nav는 비워 둔다(meta에 null)
    manual_start: false        # true면 /patrol/state 없이 노드 시작 즉시 기록(patrol_node 없이 달릴 때)
    record_button: 7           # 바퀴 기록 시작/끝 토글 버튼. 7 = Xbox 패드 Start(메뉴), joy_node 리눅스 Xbox 배열 기준.
                               #   데드맨(4, LB)·teleop 버튼과 겹치지 않는 버튼. 패드가 다르면 `ros2 topic echo /joy`로
                               #   누를 때 1이 되는 buttons 자리(0부터)를 보고 바꾼다(런치 인자 record_button)
    record_button_topic: /joy
    output_root: ~/limbo_bags/imitation
    bag_stop_timeout: 10.0     # s. SIGINT 뒤 bag이 닫히기를 기다리는 상한. 넘으면 경고만(SIGTERM 안 씀)
    topics: ['/scan', '/odom', '/tf', '/tf_static', '/patrol/state', '/person_detector/predictions',
             '/cmd_vel_teleop', '/cmd_vel_policy', '/cmd_vel_smoothed', '/cmd_vel_arbiter', '/cmd_vel',
             '/drive_mode', '/collision_monitor_state', '/joy', '/policy/status',
             '/rgbd_camera/image/compressed', '/rgbd_camera/camera_info']
    # 마지막 두 개(2026-11-27): 컬러 영상(JPEG)과 그 카메라 정보. 사후 판독(사람 장면·이유 모를 정지·물체)과
    # 사람 감지 모델·문턱을 바꿨을 때 다시 돌려 보기용. person_detector 입력 /rgbd_camera/image(640×400 CROP·
    # 보정, 10 Hz)를 image_transport가 압축한 토픽이라 같은 영상이다(JPEG 손실만 다름). 깊이는 아직 안 넣음(PM 결정).
    # 행인이 찍히므로 bag은 팀 안에서만 다루고 외부·공개 저장소에 올리지 않는다
    # 지표 기준(metrics.py)
    collision_edge_distance: 0.03  # m. 로봇이 움직이는 중 발판(footprint) 밖 라이다 점이 발판 가장자리에서 이 안이면 충돌.
                               #    값 = 라이다 근거리 거리 측정 오차: Livox "Specs - Mid-360 LiDAR Sensor" 페이지
                               #    Range Precision(1σ) ≤ 3 cm @ 0.2 m(반사율 80 %, 25 °C). 이보다 가까우면 측정상 닿은 것과 구별 못 함.
                               #    발판 안쪽 점(자기 몸 점·정지 중 손님 손)은 장애물이 아니라 뺀다(PM 2026-11-27)
    footprint: ''              # 비면 limbo_navigation nav2_real.yaml의 local_costmap footprint(실제 몸 0.50 × 0.59 m)
    personal_space: 0.5        # m. 사람 트랙 중심까지. 로봇이 움직이는 중(odom > stop_speed)의 침범만 센다.
                               #    멈춘 로봇에 사람이 다가온 것은 손님 응대라 로봇 잘못이 아니다(설계 2-1)
    stop_speed: 0.05           # m/s. 갇힘 지표와 개인 공간 판정의 "안 움직임" 기준. 중재기 stuck_speed와 같게
    jerk_w: 0.5                # rad/s. 이웃 명령 샘플(20 Hz) 사이 각속도 변화가 이보다 크면 비틀거림
    collision_margin: 5.0      # s. 학습에서 뺄 충돌 앞뒤 구간
    stuck_min_duration: 1.0    # s. 출발할 때 모터 응답·odom 지연(수백 ms)을 갇힘으로 세지 않게

# 모방 학습 2일 차: 데이터셋 만들기(build_dataset)·학습(train_policy)·정책 노드(policy_node).
# build_dataset·train_policy는 노드가 아니라 콘솔 스크립트지만 같은 형식으로 이 파일에서 기본값을 읽는다(명령줄이 우선).
build_dataset:
  ros__parameters:
    label_window: 0.2          # s. 스캔 직전 이 안의 운전자 명령을 정답으로. teleop 20 Hz(0.05 s)의 네 배라 한두 개 빠져도 안 버림
    intervention_weight: 2.0   # policy_assist에서 사람이 끼어든 구간 표본의 가중. 모델이 틀리는 바로 그 장면이라서
    val_fraction: 0.2          # 검증 바퀴 비율. 바퀴 단위로 나눈다(이웃 표본이 거의 같은 장면이라 섞으면 검증이 부풀려짐)
    seed: 0                    # 검증 바퀴 고르는 난수. 같은 값이면 같은 분할
    input_timeout: 0.5         # s. 이보다 오래된 odom·tf·사람 예측이면 표본 버림. policy_node.input_timeout과 같게.
                               #    person_detector는 처리한 프레임마다(빈 목록이라도) 예측을 내므로 끊김 = 카메라·인식이 죽음.
                               #    그래서 기록은 카메라를 켠 채로 해야 표본이 남는다
    map_frame: map
    odom_frame: odom
    base_frame: base_footprint
    # 입력 조립 상수(frame_builder.FrameSettings). 데이터셋 → 모델 파일 → 정책 노드로 그대로 실려 가서
    # 정책 노드 쪽에서는 따로 정하지 않는다. 바꾸면 데이터셋부터 다시 만든다
    scan_range_min: 0.1        # m. 이보다 가까운 점은 자기 몸·센서 잡음
    scan_range_max: 6.0        # m. 실내 복도 폭·사람 회피에 필요한 거리. 먼 점은 "멀다" 하나로
    goal_max_dist: 5.0         # m
    people_max_dist: 5.0       # m. personal_space 0.5 m의 열 배, 카메라 인식 거리 안
    v_max: 0.5                 # m/s. nav2_real.yaml vx_max·joy_xbox.yaml 최고 속도와 같음. 모델 출력 상한도 이 값
    w_max: 0.8                 # rad/s. nav2_real.yaml wz_max·joy_xbox.yaml 최고 각속도와 같음
    rear_mask_half_width_deg: 45.0  # 스캔 입력의 정후방 가림 반폭(72구간 중 18구간을 "모름"으로). 수동 운전 때 뒤따르는
                               #    운전자를 지운다(자율 주행 때는 없는 물체). 근거(2026-11-27, 39바퀴 움직일 때 스캔): 발판 밖·2.5 m 안·
                               #    뒤쪽 반에서 지도 벽보다 0.3 m 넘게 떨어진 점을 운전자 점으로 보면 ±45°가 그 95.0 %, 회전 중 93.1 %를 가림
                               #    (±30°는 91.7·81.0 %). 첫 학습 뒤 재검토 가능(PM). 바꾸면 데이터셋부터 다시 만든다
    nav2_params_file: ''       # 비면 limbo_navigation nav2_real.yaml(경유점 도착 허용 오차 xy_goal_tolerance)
    patrol_bt_file: ''         # 비면 limbo_navigation 실물 순찰 BT(경유점 통과 반경 RemovePassedGoals radius)

train_policy:
  ros__parameters:
    n_models: 3                # 앙상블 모델 수. 불일치(표준편차)를 재려면 셋은 있어야 하고, 추론 시간은 개수에 비례
    hidden: [256, 128]
    lr: 0.001                  # Adam 기본값
    batch: 256
    max_epochs: 200            # 상한일 뿐이고 보통 early stopping이 먼저 멈춘다
    patience: 10               # epoch. 검증 손실이 이만큼 안 나아지면 멈추고 최선 가중치로
    w_weight: 2.0              # 손실에서 각속도 비중. 사람·벽 피하는 판단이 w에 담겨서
    threshold_quantile: 0.95   # 검증 표본 불일치의 이 분위수가 문턱. 처음 본 바퀴의 95 %는 정책이 맡는다는 뜻
    seed: 0                    # 모델 i는 seed + i

policy_node:
  ros__parameters:
    model_path: ''             # train_policy 결과 .pt. 런치 인자 model_path가 덮어쓴다. 없으면 status no_model → 중재기가 nav
    backend: torch             # torch | numpy(torch 없는 보드에서. 결과는 같고 느릴 수 있음)
    waypoints_file: ''         # 런치가 patrol_node와 같은 파일을 넘긴다. 비면 limbo_patrol의 real_loop_waypoints.yaml
    input_timeout: 0.5         # s. odom·tf·사람 예측·스캔이 이보다 오래되면 명령을 안 내고 status ok=false.
                               #    사람 예측 끊김은 "사람 없음"이 아니라 "카메라·인식이 죽음"(빈 목록도 매 프레임 옴) → MPPI로 넘긴다
    ax_max: 0.502              # m/s². nav2_real.yaml MPPI ax_max·velocity_smoother max_accel[0]과 같게(같은 바퀴·모터)
    aw_max: 1.894              # rad/s². nav2_real.yaml max_angular_accel·velocity_smoother max_accel[2]와 같게
    map_frame: map
    odom_frame: odom
    base_frame: base_footprint
    timing_log_period: 10.0    # s. 처리 시간(입력 조립+추론) 중앙값·최대를 INFO로 남기는 주기
    scan_topic: /scan
    odom_topic: /odom
    patrol_state_topic: /patrol/state
    predictions_topic: /person_detector/predictions
    cmd_topic: /cmd_vel_policy           # 중재기 policy_topic
    status_topic: /policy/status         # 중재기 policy_status_topic
