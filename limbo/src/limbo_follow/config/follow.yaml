# 따라가기(follow_node) 튜닝 값. 바꾼 뒤 노드만 다시 띄우면 적용된다. 토픽 이름은 코드 기본값을 쓴다
follow_node:
  ros__parameters:
    follow_distance: 1.5      # m, 운용자와 유지할 거리. 목표점은 운용자에서 로봇 쪽으로 이만큼 앞 (HumanLayer 치명 0.25 + 팽창 0.45 밖).
                              # 카메라(0.6 m 높이, 세로 54°)는 바닥이 1.18 m 앞부터 보여 1.2 m 안에서는 하반신 박스가 잘려 운용자를 놓친다
                              # (2단계 6회차: 1.2 m에 서자 lost). 1.5 m면 발목 밴드까지 보인다
    resume_distance: 1.5      # m, 선 채로 이보다 멀어지면 다시 간다. follow_distance보다 크게 두면 그 사이에서 서는데, 1.5로 두니
                              # "1.2에 서고 1.5에 출발"이 되풀이돼 홀에서 평균 0.25 m/s(운용자 0.5)로 뒤처졌다(2단계 4·5회차).
                              # 같은 값이면 목표점(운용자 1.2 m 앞)이 조금씩 앞으로 가고 컨트롤러가 알아서 느려져 가다 서다가 없다
    target_stale_sec: 1.0     # s, /follow/target found가 이보다 오래되면 못 보는 것으로 봄
    lost_stop_sec: 15.0       # s, 놓친 채 이 시간이 지나면 따라가기를 끝낸다 (경보). 그 전에는 운용자가 마지막에 있던 자리로 가서 가던 쪽을 본다.
                              # 모퉁이에서 3 m 뒤처진 로봇이 거기까지 가는 데 6~8 s 걸려 5 s로는 모자랐다 (2단계 2회차)
    goal_min_move: 0.15       # m, 목표점이 이보다 덜 움직였으면 다시 보내지 않음 (1 Hz 재계획 떨림 방지)
    search_ahead: 1.5         # m, 멀리서 놓치면 마지막 자리에서 가던 방향으로 이만큼 더 간 점을 목표로 (모퉁이 너머 내다보기, 2단계 7회차)
                              # 운용자가 걷고 있었을 때만. 멈춰 있던 운용자에게 쓰면 옛 진행 방향으로 지나쳐 달린다 (3단계 fw9)
    moving_speed: 0.1         # m/s, 운용자 속도가 이보다 크면 "걷는 중"으로 보고 가던 방향을 기억한다
    look_angle_deg: 25.0      # °, 놓쳤을 때 마지막 자리가 로봇 정면에서 이 각도 밖이면 먼저 제자리에서 그쪽으로 돌아본다.
                              # 경로가 꺾여 운용자가 카메라 시야(반각 34°) 밖으로 나간 경우 (3단계 fw10). 시야 안이면 바로 내다보기
    moving_window_sec: 1.0    # s, "걷는 중" 판단에 쓰는 위치 이력 창. 추적기의 한 프레임 속도는 벽 모서리에 잘린 박스에 속아 0이 되어
                              # 걷던 운용자를 멈춤으로 봤다(fw18·fw20). 추적기 멈춤 창 0.6 s보다 길게. 길수록 멈춘 운용자를 늦게 알아챈다
