<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Limbo 관리자</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif; background: #101923; color: #eaf0f3; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 22px 32px; border-bottom: 1px solid #304050; }
    .brand { display: flex; align-items: center; gap: 13px; }
    .logo { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: #4ce0bf; color: #10232b; font-weight: 900; }
    h1 { font-size: 20px; margin: 0; letter-spacing: -.03em; }
    header small, .muted { color: #91a5b0; }
    .connection { display: flex; align-items: center; gap: 8px; color: #a9bdc7; font-size: 13px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #ee6e6e; }
    .dot.on { background: #4ce0bf; box-shadow: 0 0 0 4px #4ce0bf22; }
    main { max-width: 1500px; margin: auto; padding: 30px 32px 44px; }
    .intro { display: flex; justify-content: space-between; align-items: end; margin-bottom: 24px; gap: 16px; }
    .intro h2 { font-size: 29px; margin: 0 0 6px; letter-spacing: -.04em; }
    .intro p { margin: 0; color: #91a5b0; font-size: 14px; }
    .updated { color: #91a5b0; font-size: 13px; }
    .grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(310px, 1fr); gap: 18px; }
    .panel { border: 1px solid #304050; background: #17232e; border-radius: 18px; overflow: hidden; }
    .panel-head { padding: 19px 22px; border-bottom: 1px solid #304050; display: flex; align-items: center; justify-content: space-between; }
    .panel-actions { display: flex; align-items: center; gap: 10px; }
    .map-toggle { border: 1px solid #3b5060; border-radius: 7px; padding: 6px 10px; background: #253743; color: #eaf0f3; cursor: pointer; font: inherit; font-size: 12px; }
    .map-toggle:hover, .map-toggle:focus-visible, .robot-button:focus-visible { outline: 2px solid #4ce0bf; outline-offset: 2px; }
    .panel.map-fullscreen { position: fixed; inset: 16px; z-index: 10; display: flex; flex-direction: column; box-shadow: 0 24px 80px #0009; }
    .map-fullscreen .map-wrap { flex: 1; height: auto; min-height: 0; }
    h3 { font-size: 15px; margin: 0; }
    .tag { color: #a0b4bf; background: #243442; padding: 6px 9px; font-size: 11px; border-radius: 6px; }
    .map-wrap { position: relative; height: min(57vh, 560px); min-height: 350px; background: #111d27; }
    canvas { width: 100%; height: 100%; display: block; }
    .map-empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; color: #8299a6; pointer-events: none; }
    .map-empty[hidden], [hidden] { display: none !important; }
    .legend { display: flex; gap: 16px; padding: 14px 22px; color: #9eb1ba; font-size: 12px; border-top: 1px solid #304050; flex-wrap: wrap; }
    .legend span { display: flex; align-items: center; gap: 7px; }
    .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
    .stack { display: grid; gap: 18px; align-content: start; }
    .body { padding: 22px; }
    .robot-list { display: grid; gap: 9px; }
    .robot-button { width: 100%; border: 1px solid #344655; border-radius: 11px; background: #20303c; color: inherit; padding: 13px 14px; cursor: pointer; display: flex; align-items: center; gap: 12px; text-align: left; font: inherit; }
    .robot-button:hover { background: #2a3c49; }
    .robot-button.selected { border-color: #7e9baa; background: #2b3e4c; }
    .robot-button strong { display: block; font-size: 14px; }
    .robot-button small { display: block; color: #9db0ba; margin-top: 3px; font-size: 12px; }
    .status-dot { flex: none; width: 12px; height: 12px; border-radius: 50%; background: #93a5af; box-shadow: 0 0 0 4px #93a5af22; }
    .status-dot.ok { background: #4ce0a3; box-shadow: 0 0 0 4px #4ce0a322; }
    .status-dot.error { background: #ff6879; box-shadow: 0 0 0 4px #ff687922; }
    .status-dot.warning { background: #ffca70; box-shadow: 0 0 0 4px #ffca7022; }
    .robot-button .status-text { margin-left: auto; font-size: 12px; white-space: nowrap; }
    .detail-title { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; margin: 0 0 17px; }
    .kv { display: grid; grid-template-columns: 90px 1fr; gap: 12px; padding: 11px 0; border-top: 1px solid #2c3c49; font-size: 14px; }
    .kv span { color: #91a5b0; }
    .kv strong { font-weight: 550; text-align: right; overflow-wrap: anywhere; }
    .alerts-title { font-size: 13px; font-weight: 700; margin: 21px 0 11px; color: #b5c6ce; }
    .alert { border-radius: 10px; padding: 13px 14px; margin-bottom: 10px; background: #293846; border-left: 3px solid #889caa; }
    .alert.warn { border-left-color: #ffca70; background: #3b342c; }
    .alert.error { border-left-color: #ff838e; background: #3c2b34; }
    .alert strong { display: block; font-size: 13px; margin-bottom: 4px; }
    .alert p { margin: 0; font-size: 13px; color: #c0ccd2; overflow-wrap: anywhere; }
    .empty { color: #8ea3ae; font-size: 14px; margin: 0; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } .map-wrap { height: 45vh; } }
    @media (max-width: 560px) { header { padding: 17px 18px; } main { padding: 24px 16px; } .intro h2 { font-size: 24px; } .updated { display: none; } }
  </style>
</head>
<body>
  <header>
    <div class="brand"><div class="logo">L</div><div><h1>Limbo 관리자</h1><small>로봇 모니터링</small></div></div>
    <div class="connection"><span id="connection-dot" class="dot"></span><span id="connection-text">서버 연결 중</span></div>
  </header>
  <main>
    <div class="intro"><div><h2>운행 현황</h2><p>지도 또는 로봇 목록에서 Limbo를 선택해 상태를 확인합니다.</p></div><span class="updated" id="updated">업데이트 대기 중</span></div>
    <div class="grid">
      <section class="panel" id="map-panel" aria-label="로봇 위치 지도">
        <div class="panel-head"><h3>현재 위치</h3><div class="panel-actions"><span class="tag" id="map-tag">지도 대기 중</span><button class="map-toggle" id="map-toggle" type="button" aria-pressed="false">크게 보기</button></div></div>
        <div class="map-wrap"><canvas id="map" aria-label="로봇 위치를 클릭하면 상세 정보를 표시합니다"></canvas><div class="map-empty" id="map-empty">/map 토픽을 기다리는 중입니다.</div></div>
        <div class="legend"><span><i class="swatch" style="background:#e9eee9"></i>이동 가능</span><span><i class="swatch" style="background:#354553"></i>장애물</span><span><i class="swatch" style="background:#4ce0a3"></i>정상</span><span><i class="swatch" style="background:#ff6879"></i>오류</span><span><i class="swatch" style="background:#ffca70"></i>경고</span></div>
      </section>
      <div class="stack">
        <section class="panel"><div class="panel-head"><h3>로봇 상태</h3><span class="tag" id="robot-count">0대</span></div><div class="body robot-list" id="robot-list"></div></section>
        <section class="panel"><div class="panel-head"><h3>로봇 상세</h3><span class="tag" id="detail-tag">선택 전</span></div><div class="body">
          <p class="empty" id="detail-empty">지도 또는 목록에서 Limbo를 선택하세요.</p>
          <div id="detail-content" hidden>
            <div class="detail-title"><span class="status-dot" id="detail-dot"></span><span id="detail-id"></span></div>
            <div class="kv"><span>운행 상태</span><strong id="detail-health"></strong></div>
            <div class="kv"><span>순찰 상태</span><strong id="detail-patrol"></strong></div>
            <div class="kv"><span>목표 지점</span><strong id="detail-target"></strong></div>
            <div class="kv"><span>상세</span><strong id="detail-message"></strong></div>
            <div class="alerts-title" id="alerts-title">오류 및 경고</div>
            <div id="alerts"></div>
          </div>
        </div></section>
      </div>
    </div>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const canvas = $('map');
    const ctx = canvas.getContext('2d');
    let map = null, mapImage = null, mapRevision = 0, robots = [], selectedId = null, markers = [];
    const labels = { waiting: 'Nav2 대기 중', moving: '목표 지점으로 이동 중', recovering: 'Nav2 복구 시도 발생', paused: '지점에서 대기 중', completed: '순찰 완료', error: '순찰 오류' };
    const healthLabels = { ok: '정상', error: '오류', warning: '경고', unknown: '상태 대기' };
    const colors = { ok: '#4ce0a3', error: '#ff6879', warning: '#ffca70', unknown: '#93a5af' };

    function setText(id, value) { $(id).textContent = value; }
    function setConnection(online) {
      $('connection-dot').classList.toggle('on', online);
      setText('connection-text', online ? '서버 연결됨' : '서버 연결 끊김');
    }
    function makeMapImage(value) {
      const off = document.createElement('canvas');
      off.width = value.width; off.height = value.height;
      const imageCtx = off.getContext('2d');
      const pixels = imageCtx.createImageData(value.width, value.height);
      for (let y = 0; y < value.height; y++) {
        for (let x = 0; x < value.width; x++) {
          const occupied = value.cells[y * value.width + x];
          const color = occupied < 0 ? [108, 126, 137] : occupied >= 65 ? [53, 69, 83] : occupied >= 25 ? [153, 165, 162] : [233, 238, 233];
          const i = (y * value.width + x) * 4;
          pixels.data.set([...color, 255], i);
        }
      }
      imageCtx.putImageData(pixels, 0, 0);
      return off;
    }
    function drawMap() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      ctx.scale(dpr, dpr);
      ctx.fillStyle = '#111d27'; ctx.fillRect(0, 0, rect.width, rect.height);
      markers = [];
      if (!map || !mapImage) return;
      const {width, height, resolution, origin} = map;
      const w = width * resolution, h = height * resolution;
      const c = Math.cos(origin.yaw), s = Math.sin(origin.yaw);
      const corners = [[0,0],[w,0],[0,h],[w,h]].map(([x,y]) => [origin.x+x*c-y*s, origin.y+x*s+y*c]);
      const xs = corners.map(p => p[0]), ys = corners.map(p => p[1]);
      const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
      const scale = Math.min((rect.width-42)/(maxY-minY || 1), (rect.height-42)/(maxX-minX || 1));
      const midX = (minX+maxX)/2, midY = (minY+maxY)/2;
      function screen(x,y) {
        return [rect.width/2 - (y-midY)*scale, rect.height/2 - (x-midX)*scale];
      }
      ctx.save();
      ctx.translate(rect.width/2, rect.height/2);
      ctx.transform(0, -scale, -scale, 0, 0, 0);
      ctx.translate(-midX, -midY);
      ctx.translate(origin.x, origin.y);
      ctx.rotate(origin.yaw);
      ctx.drawImage(mapImage, 0, 0, w, h);
      ctx.restore();
      for (const robot of robots) {
        if (!robot.pose) continue;
        const [x,y] = screen(robot.pose.x, robot.pose.y);
        const color = colors[robot.health] || colors.unknown;
        const selected = robot.id === selectedId;
        ctx.save(); ctx.translate(x,y);
        ctx.beginPath(); ctx.arc(0,0,selected ? 21 : 18,0,Math.PI*2);
        ctx.fillStyle = color + '33'; ctx.fill();
        if (selected) { ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke(); }
        ctx.rotate(Math.atan2(-Math.cos(robot.pose.yaw), -Math.sin(robot.pose.yaw)));
        ctx.beginPath(); ctx.moveTo(13,0); ctx.lineTo(-8,-8); ctx.lineTo(-5,0); ctx.lineTo(-8,8); ctx.closePath();
        ctx.fillStyle = color; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#12332f'; ctx.stroke();
        ctx.restore();
        ctx.font = '600 12px system-ui, sans-serif';
        const labelWidth = ctx.measureText(robot.id).width + 16;
        ctx.fillStyle = '#14212def'; ctx.fillRect(x-labelWidth/2, y+22, labelWidth, 23);
        ctx.strokeStyle = color; ctx.strokeRect(x-labelWidth/2, y+22, labelWidth, 23);
        ctx.fillStyle = '#f3f7f8'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(robot.id, x, y+34);
        markers.push({id:robot.id,x,y,labelWidth});
      }
    }
    async function loadMap(revision) {
      const response = await fetch('/api/map');
      if (!response.ok) return;
      const value = await response.json();
      mapImage = makeMapImage(value); map = value; mapRevision = revision;
      $('map-empty').hidden = true;
      setText('map-tag', `전체 지도 · ${(value.width * value.resolution).toFixed(1)} × ${(value.height * value.resolution).toFixed(1)} m`);
      drawMap();
    }
    function renderRobots() {
      const list = $('robot-list'); list.replaceChildren();
      setText('robot-count', `${robots.length}대`);
      for (const robot of robots) {
        const button = document.createElement('button');
        const dot = document.createElement('span');
        const text = document.createElement('span');
        const id = document.createElement('strong');
        const state = document.createElement('small');
        const health = document.createElement('span');
        button.type = 'button'; button.className = 'robot-button' + (robot.id === selectedId ? ' selected' : '');
        button.setAttribute('aria-pressed', String(robot.id === selectedId));
        dot.className = 'status-dot ' + robot.health;
        id.textContent = robot.id;
        state.textContent = robot.patrol ? labels[robot.patrol.state] : '순찰 상태 대기 중';
        health.className = 'status-text'; health.textContent = healthLabels[robot.health];
        text.append(id,state); button.append(dot,text,health);
        button.addEventListener('click', () => selectRobot(robot.id));
        list.append(button);
      }
    }
    function renderDetail() {
      const robot = robots.find(item => item.id === selectedId);
      $('detail-empty').hidden = !!robot;
      $('detail-content').hidden = !robot;
      if (!robot) { setText('detail-tag','선택 전'); return; }
      const patrol = robot.patrol;
      const terminal = patrol && (patrol.state === 'completed' || patrol.state === 'error');
      setText('detail-tag', healthLabels[robot.health]);
      $('detail-dot').className = 'status-dot ' + robot.health;
      setText('detail-id', robot.id);
      setText('detail-health', healthLabels[robot.health]);
      setText('detail-patrol', !robot.patrol_online && !terminal ? '순찰 노드 중지' : patrol ? labels[patrol.state] : '순찰 노드 대기 중');
      setText('detail-target', patrol && patrol.target ? patrol.target : '—');
      setText('detail-message', patrol && patrol.detail ? patrol.detail : '—');
      const alerts = robot.diagnostics.map(d => ({name:d.name,message:d.message,level:d.level}));
      if (patrol && patrol.state === 'error') alerts.unshift({name:'순찰 실패',message:patrol.detail || '원인을 확인하세요',level:2});
      setText('alerts-title', `오류 및 경고 · ${alerts.length}건`);
      const box = $('alerts'); box.replaceChildren();
      if (!alerts.length) { const p=document.createElement('p'); p.className='empty'; p.textContent='현재 표시할 오류가 없습니다.'; box.append(p); }
      for (const alert of alerts) {
        const item=document.createElement('div'), title=document.createElement('strong'), message=document.createElement('p');
        item.className='alert '+(alert.level >= 2 ? 'error' : 'warn'); title.textContent=alert.name; message.textContent=alert.message;
        item.append(title,message); box.append(item);
      }
    }
    function selectRobot(id) { selectedId = id; renderRobots(); renderDetail(); drawMap(); }
    function render(status) {
      robots = status.robots || [];
      setText('updated', `마지막 확인 ${new Date().toLocaleTimeString('ko-KR')}`);
      renderRobots(); renderDetail(); drawMap();
    }
    async function refresh() {
      try {
        const response = await fetch('/api/status', {cache:'no-store'});
        if (!response.ok) throw new Error('server error');
        const status = await response.json();
        setConnection(true); render(status);
        if (status.map_revision && status.map_revision !== mapRevision) await loadMap(status.map_revision);
      } catch (_) { setConnection(false); setText('updated', '서버 응답 없음'); }
    }
    canvas.addEventListener('click', event => {
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left, y = event.clientY - rect.top;
      const marker = [...markers].reverse().find(m => Math.abs(x-m.x) <= Math.max(23,m.labelWidth/2) && y >= m.y-22 && y <= m.y+48);
      if (marker) selectRobot(marker.id);
    });
    canvas.addEventListener('mousemove', event => {
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left, y = event.clientY - rect.top;
      canvas.style.cursor = markers.some(m => Math.abs(x-m.x) <= Math.max(23,m.labelWidth/2) && y >= m.y-22 && y <= m.y+48) ? 'pointer' : 'default';
    });
    window.addEventListener('resize', drawMap);
    $('map-toggle').addEventListener('click', () => {
      const expanded = $('map-panel').classList.toggle('map-fullscreen');
      $('map-toggle').setAttribute('aria-pressed', String(expanded));
      setText('map-toggle', expanded ? '닫기' : '크게 보기');
      drawMap();
    });
    window.addEventListener('keydown', event => {
      if (event.key === 'Escape' && $('map-panel').classList.contains('map-fullscreen')) $('map-toggle').click();
    });
    refresh(); setInterval(refresh, 1000);
  </script>
</body>
</html>
