amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # Nav2 기본 트리 사본: 진로 위로 다가오는 사람이나 사람 때문에 코앞이 막혔으면 경로 추종·계획 실패에도 멈춰 기다린다
    # (behavior_trees/, 판단은 tof_node /person_approaching·/person_blocking, PROJECT.md 2-1·2-2, R5)
    default_nav_to_pose_bt_xml: $(find-pkg-share limbo_navigation)/behavior_trees/limbo_navigate_to_pose_w_replanning_and_recovery.xml
    default_nav_through_poses_bt_xml: $(find-pkg-share limbo_navigation)/behavior_trees/limbo_navigate_through_poses_w_replanning_and_recovery.xml
    plugin_lib_names: ["limbo_is_person_blocking_condition_bt_node"]

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 80
      model_dt: 0.05
      batch_size: 2000
      # 우리 프로젝트에서는 횡이동은 없어 y축 설정값 제외함
      ax_max: 1.0
      ax_min: -1.0
      az_max: 4.0
      vx_std: 0.2
      vx_max: 0.6
      vx_min: 0.0
      wz_std: 0.8
      wz_max: 1.8
      iteration_count: 1
      # 2026-10-14 1.7 → 2.5: MPPI는 예측 시간(4 s) 안에 갈 수 있는 경로만 보므로 1.7 m면 0.425 m/s가 사실상 상한이 됨.
      # 2.5(= 상한 0.6 × 4 s 이상)로 충장로 직선 0.42 → 0.58 m/s, 사람 있는 복도·홀에서도 충돌 0·사람 거리 동일에 시간 −22~27 %
      # (experiments/2026-10-13_chungjang_speed, 2026-10-14_speed_social). 상한 0.75는 MPPI 경고가 늘어 보류
      prune_distance: 2.5
      transform_tolerance: 0.5
      temperature: 0.2
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 9.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      # TwirlingCritic:
      #   enabled: true
      #   twirling_cost_power: 1
      #   twirling_cost_weight: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      transform_tolerance: 0.5
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      # v14: 몸체 0.45 m + 바퀴 폭 0.59 m → 앞뒤 0.50 × 좌우 0.59 m (실제 크기), 여유 없음.
      # 받은 trash_robot_sim 값(0.63 m + 여유 0.02)으로는 0.9 m 문·1.3 m 책상 통로에서 MPPI가 경로를 못 찾았다
      # (experiments/2026-10-13_tight_spaces). 이전 모델(robot:=legacy)은 launch에서 0.45 m 정사각형 + 여유 0.02로 바꿔 넣는다
      footprint: "[[0.25, 0.295], [0.25, -0.295], [-0.25, -0.295], [-0.25, 0.295]]"
      footprint_padding: 0.0
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      use_maximum: true
      plugins: ["static_layer","stvl_layer", "human_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        # 로봇 바깥 반지름(약 0.39 m)보다 커야 MPPI가 외곽 충돌 검사를 제대로 한다 (v14. 이전 모델은 0.40)
        inflation_radius: 0.45

      human_layer:
        plugin: "limbo_navigation::HumanLayer"
        enabled: true
        max_prediction_age: 1.0   # s, 이보다 오래된 예측은 버림 (person_detector는 그 프레임에서 본 사람만 보냄)
        # 사람 중심에서 이 반경 안은 치명(254). 사람 몸 반경(어깨 폭 0.45~0.5 m). MPPI는 치명만 충돌로 보기 때문에
        # 이게 없으면 사람을 뚫는 궤적을 고른다 (2026-10-13 복도 실험, KNOWN_ISSUES 2번). 뒤의 inflation 층이 로봇 반경만큼 부풀림
        lethal_radius: 0.25
        lethal_time: 0.5          # s, 현재 위치 + 이 시간 안의 예측점까지 치명. 예측 경로 전부를 치명으로 하면 사람만 보면 우회함 (PROJECT 2-1)
        radius: 0.35              # m, 가우시안 비용을 칠하는 최대 반경
        sigma: 0.15               # m, 가우시안 퍼짐
        near_peak_cost: 220.0     # 가까운 미래(min_prediction_time) 예측점의 중심 비용
        far_peak_cost: 110.0      # 먼 미래(max_prediction_time) 예측점의 중심 비용. 사이는 선형
        min_prediction_time: 0.25 # s, person_detector 예측 간격과 같게
        max_prediction_time: 2.0  # s, person_detector 예측 길이(horizon)와 같게
        min_cost: 10.0            # 이보다 작은 가우시안 꼬리는 안 칠함

      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"

        enabled: true

        # ------------------------------------------
        # 시간 기반 obstacle 제거
        # ------------------------------------------

        # linear decay
        decay_model: 0

        # 약 1초 동안 재관측되지 않은 voxel을 decay
        voxel_decay: 1.0

        voxel_size: 0.05

        # local costmap이므로 unknown 공간을 별도로 유지하지 않음
        track_unknown_space: false

        mark_threshold: 0

        update_footprint_enabled: true

        # 기존 costmap과 max 방식으로 결합
        combination_method: 1

        origin_z: 0.0

        # 디버깅 중에는 켜두기
        publish_voxel_map: true

        transform_tolerance: 0.3

        mapping_mode: false

        map_save_duration: 60.0


        # ==================================================
        # Observation Sources
        # ==================================================

        observation_sources: "mid360_mark mid360_clear rgbd_mark rgbd_clear tof_mark"


        # ==================================================
        # MID-360 MARK
        # 실제 장애물 voxel 생성
        # ==================================================

        mid360_mark:

          data_type: PointCloud2

          topic: /mid360/points_filtered

          marking: true
          clearing: false

          obstacle_range: 4.5

          min_obstacle_height: 0.03
          max_obstacle_height: 1.00   # v14 높이 0.95 m + 여유 (이전 모델은 0.80)

          expected_update_rate: 0.0
          observation_persistence: 0.0

          inf_is_valid: false

          filter: "voxel"

          voxel_min_points: 0

          clear_after_reading: true


        # ==================================================
        # MID-360 CLEAR
        # MID-360 시야 + temporal clearing
        # ==================================================

        mid360_clear:

          enabled: true

          data_type: PointCloud2

          topic: /mid360/points_filtered

          marking: false
          clearing: true

          # LiDAR 유효 범위
          min_z: 0.10
          max_z: 20.0

          # MID-360:
          # vertical FOV = -7° ~ +52°
          # 전체 약 59° = 1.03 rad
          vertical_fov_angle: 1.03

          # 중심은 약 +22.5°
          vertical_fov_offset: 0.393

          # 360°
          horizontal_fov_angle: 6.283

          vertical_fov_padding: 0.05

          # 3D LiDAR
          model_type: 1

          decay_acceleration: 5.0


        # ==================================================
        # RGB-D MARK
        # ==================================================

        rgbd_mark:

          data_type: PointCloud2

          topic: /rgbd_camera/points

          marking: true
          clearing: false

          obstacle_range: 4.5

          min_obstacle_height: 0.02
          max_obstacle_height: 1.00   # v14 높이 0.95 m + 여유 (이전 모델은 0.80)

          expected_update_rate: 0.0
          observation_persistence: 0.0

          inf_is_valid: false

          filter: "voxel"

          voxel_min_points: 0

          clear_after_reading: true


        # ==================================================
        # ToF MARK (범퍼 높이 0.10 m, 8x8 63°, 4 m)
        # 카메라(0.7 m·0°)는 30 cm 상자 윗면을 0.78 m 안에서 놓쳐 STVL이 지우면 로봇이 파고든다
        # (2026-10-14 상자 벤치 접촉 64.8 s). 코앞 낮은 장애물은 ToF가 계속 표시한다. 지우기는 안 함(시간 감쇠로)
        # ==================================================

        tof_mark:

          data_type: PointCloud2

          topic: /tof/points

          marking: true
          clearing: false

          obstacle_range: 2.0         # 8x8라 멀면 점이 성기다. 코앞용

          min_obstacle_height: 0.03   # 바닥 반사 거름 (tof.yaml과 같음)
          max_obstacle_height: 1.00

          expected_update_rate: 0.0
          observation_persistence: 0.0

          inf_is_valid: false

          filter: "voxel"

          voxel_min_points: 0

          clear_after_reading: true


        # ==================================================
        # RGB-D CLEAR
        # ==================================================

        rgbd_clear:

          enabled: true

          data_type: PointCloud2

          topic: /rgbd_camera/points

          marking: false
          clearing: true

          min_z: 0.10
          max_z: 5.0

          # 현재 Gazebo RGB-D horizontal_fov = 1.25
          horizontal_fov_angle: 1.25

          # 우선 일반적인 depth camera 값으로 시작
          vertical_fov_angle: 0.95

          # Depth camera model
          model_type: 0

          decay_acceleration: 5.0

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_topic: /map
        map_subscribe_transient_local: True
        subscribe_to_updates: true
        transform_tolerance: 0.2
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:

      global_frame: map
      robot_base_frame: base_link
      use_sim_time: true

      # v14: 몸체 0.45 m + 바퀴 폭 0.59 m → 앞뒤 0.50 × 좌우 0.59 m (실제 크기), 여유 없음.
      # 받은 trash_robot_sim 값(0.63 m + 여유 0.02)으로는 0.9 m 문·1.3 m 책상 통로에서 MPPI가 경로를 못 찾았다
      # (experiments/2026-10-13_tight_spaces). 이전 모델(robot:=legacy)은 launch에서 0.45 m 정사각형 + 여유 0.02로 바꿔 넣는다
      footprint: "[[0.25, 0.295], [0.25, -0.295], [-0.25, -0.295], [-0.25, 0.295]]"
      footprint_padding: 0.0

      resolution: 0.05
      track_unknown_space: true

      # 경로 계획기도 지도에 없는 장애물(낮은 상자 등)을 알아야 처음부터 돌아가는 경로를 그린다.
      # 로컬에만 있으면 경로가 장애물을 관통하고, MPPI가 그 앞에서 머뭇거리다 장애물이 시야에서 빠져 잊히면 부딪혔다.
      # 대신 좁은 복도를 사람이 막으면 경로 계획이 실패하고 재시도한다 (docs/KNOWN_ISSUES.md)
      plugins: ["static_layer", "stvl_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"

        enabled: true

        # ------------------------------------------
        # 시간 기반 obstacle 제거
        # ------------------------------------------

        # linear decay
        decay_model: 0

        # 경로 계획용 기억 시간. 사람이 지나간 자리가 이 시간만큼 전역 costmap에 남아
        # 전역 경로를 흔들기 때문에 상자 회피가 유지되는 한 작게 둔다.
        # 2026-10-14 15 → 3초: 3초·15초 성적이 같았음(상자 회피 유지, 복도 복구 같음)
        voxel_decay: 3.0

        voxel_size: 0.05

        # local costmap이므로 unknown 공간을 별도로 유지하지 않음
        track_unknown_space: false

        mark_threshold: 0

        update_footprint_enabled: true

        # 기존 costmap과 max 방식으로 결합
        combination_method: 1

        origin_z: 0.0

        # 디버깅 중에는 켜두기
        publish_voxel_map: false

        transform_tolerance: 0.3

        mapping_mode: false

        map_save_duration: 60.0


        # ==================================================
        # Observation Sources
        # ==================================================

        observation_sources: "mid360_mark mid360_clear rgbd_mark rgbd_clear"


        # ==================================================
        # MID-360 MARK
        # 실제 장애물 voxel 생성
        # ==================================================

        mid360_mark:

          data_type: PointCloud2

          topic: /mid360/points_filtered

          marking: true
          clearing: false

          obstacle_range: 4.5

          min_obstacle_height: 0.03
          max_obstacle_height: 1.00   # v14 높이 0.95 m + 여유 (이전 모델은 0.80)

          expected_update_rate: 0.0
          observation_persistence: 0.0

          inf_is_valid: false

          filter: "voxel"

          voxel_min_points: 0

          clear_after_reading: true


        # ==================================================
        # MID-360 CLEAR
        # MID-360 시야 + temporal clearing
        # ==================================================

        mid360_clear:

          enabled: true

          data_type: PointCloud2

          topic: /mid360/points_filtered

          marking: false
          clearing: true

          # LiDAR 유효 범위
          min_z: 0.10
          max_z: 20.0

          # MID-360:
          # vertical FOV = -7° ~ +52°
          # 전체 약 59° = 1.03 rad
          vertical_fov_angle: 1.03

          # 중심은 약 +22.5°
          vertical_fov_offset: 0.393

          # 360°
          horizontal_fov_angle: 6.283

          vertical_fov_padding: 0.05

          # 3D LiDAR
          model_type: 1

          decay_acceleration: 5.0


        # ==================================================
        # RGB-D MARK
        # ==================================================

        rgbd_mark:

          data_type: PointCloud2

          topic: /rgbd_camera/points

          marking: true
          clearing: false

          obstacle_range: 4.5

          min_obstacle_height: 0.02
          max_obstacle_height: 1.00   # v14 높이 0.95 m + 여유 (이전 모델은 0.80)

          expected_update_rate: 0.0
          observation_persistence: 0.0

          inf_is_valid: false

          filter: "voxel"

          voxel_min_points: 0

          clear_after_reading: true


        # ==================================================
        # RGB-D CLEAR
        # ==================================================

        rgbd_clear:

          enabled: true

          data_type: PointCloud2

          topic: /rgbd_camera/points

          marking: false
          clearing: true

          min_z: 0.10
          max_z: 5.0

          # 현재 Gazebo RGB-D horizontal_fov = 1.25
          horizontal_fov_angle: 1.25

          # 우선 일반적인 depth camera 값으로 시작
          vertical_fov_angle: 0.95

          # Depth camera model
          model_type: 0

          decay_acceleration: 5.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true

        # 경로가 로봇이 못 지나가는 틈으로 나지 않게 바깥 반지름(약 0.39 m)보다 크게 (v14. 이전 모델은 0.35)
        inflation_radius: 0.45
        cost_scaling_factor: 4.0

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
# map_server:
#   ros__parameters:
#     yaml_filename: ""

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.8
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

route_server:
  ros__parameters:
    # The graph_filepath does not need to be specified since it going to be set by defaults in launch.
    # If you'd rather set it in the yaml, remove the default "graph" value in the launch file(s).
    # file & provide full path to map below. If graph config or launch default is provided, it is used
    # graph_filepath: $(find-pkg-share nav2_route)/graphs/aws_graph.geojson
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: ["ReroutingService", "CollisionMonitor"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      max_collision_dist: 3.0
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: False
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.6, 0.0, 1.8]
    min_velocity: [0.0, 0.0, -1.8]
    max_accel: [1.0, 0.0, 4.0]
    max_decel: [-1.0, 0.0, -4.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 2.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: True
      enabled: True
    observation_sources: ["mid360_cloud", "rgbd_cloud"]
    mid360_cloud:
      type: "pointcloud"
      topic: "/mid360/points_filtered"

      min_height: 0.03
      max_height: 1.00   # v14 높이 0.95 m + 여유 (이전 모델은 0.80)

      min_range: 0.05

      source_timeout: 2.0
      enabled: true

    rgbd_cloud:
      type: "pointcloud"
      topic: "/rgbd_camera/points"

      min_height: 0.02
      max_height: 1.00   # v14 높이 0.95 m + 여유 (이전 모델은 0.80)

      min_range: 0.05

      source_timeout: 2.0
      enabled: true

docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

loopback_simulator:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    map_frame_id: "map"
    scan_frame_id: "base_scan"  # tb4_loopback_simulator.launch.py remaps to 'rplidar_link'
    update_duration: 0.02
    scan_range_min: 0.05
    scan_range_max: 30.0
    scan_angle_min: -3.1415
    scan_angle_max: 3.1415
    scan_angle_increment: 0.02617
    scan_use_inf: true

# patrol_node에서 모든 waypoint 정보를 넘겨 설정한 duration 동안 대기시켰으나
# 각 waypoint마다 시간을 지정하기 힘들어 followWaypoints()방식을 goToPose()
# 방식으로 교체하려고 함. 혹시 모르니 지우지 말고 주석 처리
