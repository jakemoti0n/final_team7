amcl:
  ros__parameters:
    use_sim_time: true

    # frame 설정
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint

    # scan topic
    scan_topic: /scan

    # 로봇 모델
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    # TF
    tf_broadcast: true
    transform_tolerance: 1.0

    # particle filter
    min_particles: 500
    max_particles: 2000
    resample_interval: 1

    # laser 관련
    max_beams: 60
    laser_max_range: 20.0
    laser_min_range: 0.1

    # update 조건
    update_min_d: 0.10
    update_min_a: 0.10

    # 초기 pose는 RViz에서 줄 것이므로 false
    set_initial_pose: false

    # 노이즈 계수 (초기 기본값)
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      - map_server
      - amcl