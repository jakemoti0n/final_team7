amcl:
  ros__parameters:
    use_sim_time: true

    # frame 설정
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint

    # scan topic
    scan_topic: /scan

    # 로봇 모델
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    # TF
    tf_broadcast: true
    transform_tolerance: 1.0

    # particle filter
    min_particles: 500
    max_particles: 2000
    resample_interval: 1

    # laser 관련
    max_beams: 60
    laser_max_range: 20.0
    laser_min_range: 0.1

    # 좁은 복도에서 사람과 마주치면 사람에 맞은 빔이 지도와 어긋나 파티클이 앞뒤로 퍼지고,
    # 복도 끝 교차로에서 위치가 크게 튀었다 (aischool_2f 왼쪽 복도, 방향 51~68° 오차).
    # 대부분의 파티클에서 지도와 안 맞는 빔은 위치 계산에서 뺀다. 장애물 회피(costmap)는 모든 빔을 그대로 쓴다.
    # 안 맞는 빔이 beam_skip_error_threshold(90%)를 넘으면 스스로 꺼지고 모든 빔을 쓴다.
    laser_model_type: "likelihood_field_prob"
    do_beamskip: true
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9

    # update 조건
    update_min_d: 0.10
    update_min_a: 0.10

    # 초기 pose가 없으면 map→odom TF가 안 나와 Nav2 bringup이 시간 초과된다.
    # 시뮬레이션 스폰 위치(map 원점, 0°)로 시작하고, 다른 위치면 RViz 2D Pose Estimate로 덮어쓴다.
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

    # 노이즈 계수 (초기 기본값)
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      - map_server
      - amcl