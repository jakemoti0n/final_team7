# 바퀴 odom + MID-360 IMU 융합 (robot_localization ekf_node)
# 바퀴는 회전할 때 미끄러져 방향 오차가 쌓이므로(시뮬에서 약 8%) 전진 속도는 바퀴, 회전 속도는 IMU 자이로에서만 받는다.
# Gazebo diff-drive odom은 covariance가 전부 0이라, 같은 값을 두 센서에서 받으면 EKF가 바퀴만 믿어 버린다.
# 결과는 odom → base_footprint TF로 발행한다. diff-drive 플러그인의 TF는 브리지하지 않는다.
ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # 순서: x y z, roll pitch yaw, vx vy vz, vroll vpitch vyaw, ax ay az
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false

    # 지자기가 없어 절대 방향은 쓰지 않고 회전 속도만 쓴다
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
