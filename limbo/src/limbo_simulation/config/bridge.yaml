# Gazebo Harmonic <-> ROS 2 Jazzy bridge for Limbo

- ros_topic_name: "clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "cmd_vel"
  gz_topic_name: "cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# 뚜껑 열기/닫기 (rad, 0 닫힘 ~ 1.972 최대). v14 모델만 쓴다. MID-360이 뚜껑 위라 주행 중에는 열지 않는다
- ros_topic_name: "lid_angle"
  gz_topic_name: "lid_angle"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "odom"
  gz_topic_name: "odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# 평가용 정답 위치 (limbo_evaluation 전용, 주행 노드는 쓰지 않음)
- ros_topic_name: "ground_truth/odom"
  gz_topic_name: "ground_truth/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# odom → base_footprint TF는 EKF(ekf.yaml)가 낸다. diff-drive TF까지 브리지하면 TF가 두 곳에서 나와 튄다.

- ros_topic_name: "imu"
  gz_topic_name: "imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

- ros_topic_name: "joint_states"
  gz_topic_name: "joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS


# MID-360 3D point cloud
- ros_topic_name: "mid360/points"
  gz_topic_name: "mid360/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# ToF 근접 센서 8x8 (tof_node가 읽음)
- ros_topic_name: "tof/points"
  gz_topic_name: "tof/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# 카메라 컬러·깊이·CameraInfo는 bridge_camera.yaml에 따로 있다 (camera:=oak이면 실물 OAK가 대신 냄)

# 3D point cloud
- ros_topic_name: "/rgbd_camera/points"
  gz_topic_name: "/rgbd_camera/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS
