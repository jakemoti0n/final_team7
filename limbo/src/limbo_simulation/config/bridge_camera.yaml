# Gazebo 카메라 컬러·깊이·CameraInfo. camera:=sim(기본)일 때만 띄운다.
# camera:=oak이면 oak_camera 노드가 같은 토픽을 실물 OAK-D Lite에서 낸다. 포인트클라우드(/rgbd_camera/points)는
# Nav2가 시뮬 월드의 장애물을 보도록 bridge.yaml에 남겨 둔다

# RGB image
- ros_topic_name: "/rgbd_camera/image"
  gz_topic_name: "/rgbd_camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# Camera calibration / intrinsics
- ros_topic_name: "/rgbd_camera/camera_info"
  gz_topic_name: "/rgbd_camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# Depth image
- ros_topic_name: "/rgbd_camera/depth_image"
  gz_topic_name: "/rgbd_camera/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
