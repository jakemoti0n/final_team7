# ============================================================
# 인지 파트 오버레이 — MPPI 전용 (팀원 소유, 자유 실험 영역)
# controller/mppi.yaml 위에 겹쳐진다. use_perception:=true 이고
# controller:=mppi 일 때만 로드됨.
#
# 이 파일은 "인지가 컨트롤러에 요구한 것"의 명세서 역할을 한다.
# 다른 컨트롤러(rpp, dwb ...)로 최종 결정되면 주행 담당이
# 같은 요구사항을 그 컨트롤러 파라미터로 번역해 overlays/<컨트롤러>_human.yaml 을 만든다.
#
# 요구사항 (2026-09-21 kkh "사람 회피 주행" 기준):
#   - 사람 예측 경로까지 고려하려면 더 긴 시간 지평(horizon)이 필요 → time_steps, prune_distance
#   - 경로 추종보다 cost 회피를 우선 → CostCritic ↑, PathAlignCritic ↓, PathFollowCritic ↑
# ============================================================
controller_server:
  ros__parameters:
    FollowPath:
      time_steps: 130          # base 56  (0.05s × 130 = 6.5s 지평)
      prune_distance: 3.5      # base 1.7
      CostCritic:
        cost_weight: 4.5       # base 3.81
      PathAlignCritic:
        cost_weight: 6.0       # base 14.0
      PathFollowCritic:
        cost_weight: 8.0       # base 5.0
