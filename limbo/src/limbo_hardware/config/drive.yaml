# /cmd_vel 브리지(roboclaw_drive) 설정. 바퀴 치수·1회전 카운트는 wheel_odometry.yaml·encoders_readonly.yaml에서
# 런치가 읽어 넣는다(한 곳에만 둔다). 출력 상한과 속도 상한은 런치 인자로 덮어쓸 수 있다.
roboclaw_drive:
  ros__parameters:
    use_sim_time: false
    port: /dev/serial/by-id/usb-Basicmicro_Inc._USB_Roboclaw_2x15A-if00
    # 바퀴별 PI + 피드포워드. 10-30~11-03 바닥 시험에서 실제로 움직인 마지막 설정(pi_baseline_02)을 그대로 둔다.
    # 정밀 추종 기준은 아직 못 넘겼으므로 "검증된 최선"이지 최종값이 아니다
    kp: 0.02
    ki: 0.10
    feedforward_gain: 0.25
    left_feedforward_gain: 0.2375     # 왼쪽이 같은 출력에서 조금 빨라 FF를 5 % 낮춤 (10-30 좌우 특성 측정)
    right_feedforward_gain: 0.2625
    # 출력 상한(raw, 32767 = 100 %). 4915 = 15 %: 팀원이 바닥 시험에 쓴 값. 11-03 축 수리 뒤 왼쪽이 15 %로 안 굴러
    # 25 %(8191)로 올릴지는 PM 결정. 코드 천장은 30 %(roboclaw_drive.DUTY_CEILING)
    max_duty_raw: 4915
    # 목표 각속도 변화율 2.0 rad/s² = 바퀴 0.15 m/s². 키보드 0.1 m/s에 0.7 s면 도달. 벤치의 0.4는 10 s 시험용이라 너무 느림
    target_slew_rad_s2: 2.0
    output_slew_per_s: 0.15           # duty 변화율(초당 15 %). 벤치와 같음. 급출발 방지, 상한까지 1 s
    velocity_window_s: 0.10           # 속도 추정 창. 0.1 s: 20 Hz 제어에서 두 표본
    control_period_s: 0.05
    # 속도 상한. 지도 작성·첫 주행은 느리게. 키보드 기본은 0.1 m/s, 0.4 rad/s로 시작하고 여기까지만 올릴 수 있다
    max_linear_m_s: 0.25
    max_angular_rad_s: 0.8
    # 납축 12 V 25 Ah: 10.5 V 아래 사용은 수명 급감. 부하 중 순간 처짐을 고려해 10.0에서 멈추고 10.3에서 다시 허용
    min_battery_volts: 10.0
    battery_recover_volts: 0.3
    battery_period_s: 0.5
    # 상한 출력인데 엔코더가 이 시간 동안 0이면 잠김. 정상 출발은 0.3 s 안에 카운트가 오른다(11-03 기록)
    stall_seconds: 1.0
    record_dir: ''                    # 비우면 기록 안 함. 주면 wire/control/events jsonl을 남긴다(폴더는 새것이어야 함)
