# /cmd_vel 브리지(roboclaw_drive) 설정. 바퀴 치수·1회전 카운트는 wheel_odometry.yaml·encoders_readonly.yaml에서
# 런치가 읽어 넣는다(한 곳에만 둔다). 출력 상한과 속도 상한은 런치 인자로 덮어쓸 수 있다.
roboclaw_drive:
  ros__parameters:
    use_sim_time: false
    port: /dev/serial/by-id/usb-Basicmicro_Inc._USB_Roboclaw_2x15A-if00
    # 제어 방식. board_speed(기본, 11-07부터): 바퀴별 목표 속도만 보드에 보내고 속도 맞추기는 보드가 한다. 보드에 속도 제어 값이
    # 저장돼 있고(tools/drive/board_setup.py) 두 엔코더가 전진 +여야 시작하며, 아니면 시작을 거부하고 이유를 찍는다.
    # host_duty: 아래 PI·피드포워드로 이 노드가 출력(duty)을 정한다(11-06까지의 방식. 저속에서 바퀴가 서고 출발에 1.5~2 s 걸림).
    # 11-07 실물: 바퀴 띄운 계단 응답, 바닥 키보드, 자동 직진 6 m 3회(좌우 차 4~7 mm, 방향 ≤1.2°, 출발 0.4 s) 통과 뒤 기본값으로
    control_mode: board_speed
    # 바퀴별 PI + 피드포워드. (host_duty에서만 쓴다. board_speed는 kp·ki·피드포워드·출력 상한·output_slew를 쓰지 않는다) 10-30~11-03 바닥 시험에서 실제로 움직인 마지막 설정(pi_baseline_02)을 그대로 둔다.
    # 정밀 추종 기준은 아직 못 넘겼으므로 "검증된 최선"이지 최종값이 아니다
    kp: 0.02
    ki: 0.10
    feedforward_gain: 0.25
    left_feedforward_gain: 0.2375     # 왼쪽이 같은 출력에서 조금 빨라 FF를 5 % 낮춤 (10-30 좌우 특성 측정)
    right_feedforward_gain: 0.2625
    # Attended forward-wheel tests, 2026-11-06. Each pair is [wheel m/s, PWM fraction].
    use_right_forward_curve: false
    right_forward_feedforward_curve: [0.07, 0.22, 0.13, 0.30]
    # 사용자 요청(2026-11-04): 일반 주행·지도 작성·통신 계층의 출력 상한을 30 %로 통일.
    # 9830 / 32767 ≈ 30 %. PWM 상한이며 목표 속도나 실제 속도의 비율을 뜻하지 않는다.
    max_duty_raw: 9830
    # 바퀴 목표 각속도 변화율. 6.8 rad/s² × 반지름 0.0738 = 전진 0.5 m/s², 회전 1.9 rad/s²(두 바퀴 반대로 돌 때, 0.53 m 간격).
    # 이 숫자는 Nav2의 MPPI(ax_max·az_max)와 속도 평활기(max_accel)에 똑같이 들어가야 한다(nav2_real.yaml). 11-07: 예전 2.0(0.15 m/s²,
    # 0.56 rad/s²)은 MPPI가 가정한 1.0/4.0보다 7배 느려 명령이 0.6 s 늦게 실현됐고 MPPI가 넘치고 되감는 지그재그가 됐다.
    # 0.5 m/s²는 바퀴 띄운 계단 시험에서 보드가 목표를 0.2~0.5 s에 잡는 것을 근거로 고른 값이며 6 m 목표 주행으로 확인한다.
    # board_speed에서는 이 값을 카운트/초²로 바꿔 보드의 가속도로 넘긴다
    target_slew_rad_s2: 6.8
    output_slew_per_s: 0.15           # duty 변화율(초당 15 %). 0에서 30 % 상한까지 최소 2 s
    # 실물 직진 출발 시험에서만 활성화하고, 반복 검증 뒤 기본값을 결정한다.
    balance_straight_start: false
    velocity_window_s: 0.10           # 속도 추정 창. 0.1 s: 20 Hz 제어에서 두 표본
    control_period_s: 0.05
    # 속도 상한. 키보드 기본은 0.1 m/s, 0.4 rad/s로 시작하고 여기까지만 올릴 수 있다. MPPI vx_max·속도 평활기 상한은 build_real_configs가 여기서 가져간다.
    # 0.25 → 0.4 → 0.5 (2026-11-09 PM 결정): 0.25에서 6 m 직진·한 바퀴 37 m, 0.4에서 한 바퀴 완주 검증 뒤. 보드 QPPS 기준 최고 0.80 m/s의 62 %, 가속 0.5 m/s²로 1 s에 도달.
    max_linear_m_s: 0.5
    # 회전 0.8: 전진 0.5와 동시 회전 시 바깥 바퀴 0.5 + 0.8×0.265 = 0.71 m/s = QPPS 최고 0.80의 89 %. 1.0이면 96 %라 보드 속도 루프가 포화해 회전이 덜 나온다(PM 선택 A).
    max_angular_rad_s: 0.8
    # 납축 12 V 25 Ah: 10.5 V 아래 사용은 수명 급감. 부하 중 순간 처짐을 고려해 10.0에서 멈추고 10.3에서 다시 허용
    min_battery_volts: 10.0
    battery_recover_volts: 0.3
    battery_period_s: 0.5
    # 상한 출력인데 엔코더가 이 시간 동안 0이면 잠김. 정상 출발은 0.3 s 안에 카운트가 오른다(11-03 기록)
    stall_seconds: 1.0
    record_dir: ''                    # 비우면 기록 안 함. 주면 wire/control/events jsonl을 남긴다(폴더는 새것이어야 함)
