roboclaw_encoder:
  ros__parameters:
    use_sim_time: false
    port: /dev/serial/by-id/usb-Basicmicro_Inc._USB_Roboclaw_2x15A-if00
    poll_hz: 20.0
    serial_timeout: 0.2
    reconnect_seconds: 2.0
    # 2026-10-29 user-selected provisional wheel CPR; not a factory specification.
    right_counts_per_revolution: 3607.0
    # 2026-10-29: round(mean(3697, 3670, 3696)) = 3688; provisional hand calibration.
    # The initial over-rotation trial is excluded. Zero disables the left angle.
    left_counts_per_revolution: 3688.0
    # Sanity guard only; a small counter reset cannot always be detected.
    max_delta_counts: 10000
    wire_log: ''
