# person_detector 튜닝 값. 바꾼 뒤 빌드 없이 노드만 다시 띄우면 적용된다.
# 토픽·좌표계 이름은 튜닝 대상이 아니라 코드 기본값을 쓴다.
person_detector:
  ros__parameters:
    # 기본은 팀원이 학습한 하반신 모델(가까워 다리만 보이는 사람도 잡음). 입력 크기는 학습 크기와 맞춘다
    # - leg_640 (기본, 입력 640): 가까운 거리 검출이 leg_512와 같거나 높고 먼 거리·군중은 같음 (변경 기록 41)
    # - 이전 기본 leg_512로 돌리려면 model: models/leg_512.pt, imgsz: 512
    # - 기존 COCO 모델로 돌리려면 model: yolo11n.pt, classes: [0], imgsz: 640 (또는 런치 인자 person_model:=yolo11n.pt)
    yolo:
      model: models/leg_640.pt  # 상대 경로는 limbo_perception share 폴더 기준으로 찾음
      confidence: 0.3
      classes: [0, 1]       # 사람으로 볼 클래스 번호 (하반신 모델 0=person, 1=leg. yolo11n은 [0])
      imgsz: 640            # 추론 입력 크기 px (학습 크기와 맞춤: leg_640 640, leg_512 512, yolo11n 640)

    # 하반신 모델은 한 사람에 person·leg 박스를 같이 내므로 추적 전에 하나로 합친다 (yolo11n에는 leg가 없어 영향 없음)
    merge:
      leg_class: 1
      leg_inside_ratio: 0.7 # leg 면적의 이 비율 이상이 person 박스 안이면 leg를 버림
      leg_iou: 0.5          # person 없이 남은 leg끼리 IoU가 이 이상이면 큰 것만 남김
      # 다리 하나씩 따로 잡힌 leg 둘을 하나로: 중심 가로 간격 ≤ 이 배수 × 두 폭 합, 세로 겹침 ≥ 짧은 쪽 높이 × 비율
      leg_pair_gap_ratio: 1.5
      leg_pair_vertical_overlap: 0.5

    # depth는 몸의 카메라 쪽 겉면까지라, 카메라→사람 방향으로 이만큼 밀어 몸 중심으로 (m). 0이면 보정 없음
    leg_radius: 0.25         # leg 박스: 다리 앞면 → 몸 중심 (human_layer lethal_radius와 같은 값)
    person_box_radius: 0.12  # person 박스: 몸통 가운데 영역 depth → 몸 두께 절반

    sync:
      queue_size: 5
      slop: 0.03            # sec, RGB와 depth 시각 차이 허용

    tf_timeout: 0.1         # sec

    # 화면 좌우 끝(이 px 안)에 닿고 폭이 이보다 좁은 박스는 거리 계산에서 뺌 (사람이 조금만 걸치면 depth가 뒤쪽 벽을 잼)
    edge_margin_px: 2
    edge_min_width_px: 40     # px (320 폭 기준 12 %)
    # person 박스의 실제 폭(픽셀 폭 × 거리 ÷ 초점 거리)이 이보다 좁으면 사람이 아님 (문틀·기둥·판 가장자리 세로 띠 오탐, 2026-10-22).
    # 사람은 옆으로 서도 0.25 m. 시뮬 사람 박스 442개 중앙값 0.56 m(박스 끝 ±2 px 여유를 더해 잼). leg 박스(다리 하나 0.1 m)는 안 봄
    min_person_width_m: 0.15
    # 같은 트랙의 depth가 한 프레임에 이만큼 넘게 튀면 그 값을 버리고 직전 값 유지 (3프레임 연속이면 새 값 채택)
    jump_reject_m: 1.0        # m

    depth:
      roi_margin: 0.30      # box 각 변에서 잘라낼 비율 (배경 제외)
      min_depth: 0.1        # m
      max_depth: 5.0        # m
      percentile: 25.0      # 중앙 영역 depth 중 가까운 쪽 25% 값 (50이면 중앙값. 다리만 보일 때 배경을 잴 수 있음)
      leg_roi_margin_x: 0.05  # leg 박스는 가로를 거의 다 씀 (두 다리가 양옆, 가운데는 다리 사이 틈)
      leg_percentile: 10.0    # leg 박스는 더 가까운 쪽 값 (틈으로 보이는 배경을 잡지 않게)

    # 벽·문·가구의 큰 면을 사람으로 본 박스 걸러내기 (2026-10-22 dev 벽 오인식: 검은 면 1.47 m를 leg_640이 person 0.34로 봄).
    # 면은 박스 가운데 깊이가 하나의 평면이고 무늬가 없다. 사람은 몸통이 둥글고 다리 사이에 틈이 있어 평면이 아니며 옷에 무늬가 있다.
    # "가운데가 평면" + "무늬 없음" 둘 다일 때만 버린다 (코앞 손님은 몸통이 평면에 가까워도 옷 무늬로 살아남는다).
    # 시뮬 측정: 사람 큰 박스 151개 평면 비율 최대 0.84·무늬 최소 3.0, 검은 판 1.0·0.0 (geometry.SurfaceConfig)
    surface:
      min_box_area_ratio: 0.15   # 화면 면적 대비 이 비율 이상인 박스만 판정 (작은 박스는 추적 조건 5프레임이 거른다)
      inner_margin: 0.30         # 박스 각 변에서 이 비율을 잘라낸 가운데만 본다
      plane_tol_m: 0.03          # m, 맞춘 평면에서 이 안이면 평면 위 (실물 스테레오 잡음 1~2 cm보다 크게)
      min_planar_ratio: 0.95     # 평면 위 픽셀 비율이 이 이상이면 평면
      max_texture: 6.0           # 가운데 명암 라플라시안 표준편차가 이 미만이면 무늬 없음
      min_valid_pixels: 50       # 가운데 유효 깊이 픽셀이 이보다 적으면 판정 안 함

    tracking:
      reassociate_max_age: 3.0        # sec
      reassociate_max_distance: 0.50  # m
      max_position_jump: 0.8          # m
      min_track_hits: 5               # frame
      track_timeout: 3.0              # sec
      # 이 시간 동안 측정 위치가 이 거리 미만으로 움직였으면 멈춘 것으로 보고 속도를 0으로 한다.
      # 실제 카메라는 위치가 시뮬레이션보다 많이 흔들리므로, 서 있는 사람이 걷는 것으로 나오면 거리를 키운다
      stop_window: 0.6                # sec
      stop_max_displacement: 0.15     # m
      kalman_measurement_noise: 0.05
      kalman_process_noise: 0.5

    motion:
      stationary_speed_threshold: 0.05  # m/s
      approach_speed_threshold: 0.03    # m/s

    prediction:
      horizon: 2.0   # sec
      dt: 0.25       # sec

    intent:
      interaction_min_x: 0.3        # m, base_link 기준 앞쪽
      interaction_max_x: 2.0        # m
      interaction_half_width: 0.8   # m, 좌우
      approach_hold_time: 0.5       # sec
      intent_min_hold_time: 2.0     # sec
      intent_lost_grace_time: 1.0   # sec
