# ToF 근접 센서 (VL53L5CX 8x8, 범퍼 높이 전면 중앙). 용도는 "코앞에 무언가 있음"뿐이고 사람·상자 구분은 카메라 기억이 한다 (R5)
tof_node:
  ros__parameters:
    points_topic: /tof/points
    base_frame: base_link
    stop_distance: 0.30        # m, 센서 앞면부터
    min_obstacle_height: 0.03  # m, base_link z. 바닥 반사 거름
    confirm_frames: 3          # 연속 프레임 같아야 바뀜 (10 Hz면 0.3 s)
