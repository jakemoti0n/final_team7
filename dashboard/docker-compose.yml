# 관제 서버 + Caddy(HTTPS·basic auth). dashboard/에서: docker compose up -d --build
# 값은 같은 폴더의 .env (cp .env.example .env 후 채움). 안내: docs/AWS_DEPLOY.md
services:
  dashboard:
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    image: limbo-dashboard
    restart: unless-stopped
    environment:
      ROBOT_TOKEN: ${ROBOT_TOKEN:?ROBOT_TOKEN을 .env에 넣으세요}
      MAP_YAML: ${MAP_YAML:-limbo/src/limbo_navigation/maps/human_test_map.yaml}
      INITIAL_WAYPOINTS: ${INITIAL_WAYPOINTS:-test_waypoints.yaml}
    volumes:
      - waypoints:/data          # 화면에서 편집한 waypoint. 컨테이너를 다시 만들어도 남음
    expose:
      - "8000"                   # 밖으로 열지 않음. Caddy만 접근

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      - dashboard
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN을 .env에 넣으세요}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?BASIC_AUTH_USER를 .env에 넣으세요}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?BASIC_AUTH_HASH를 .env에 넣으세요}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data         # 발급받은 인증서. 지우면 다시 발급(횟수 제한 있음)
      - caddy_config:/config

volumes:
  waypoints:
  caddy_data:
  caddy_config:
