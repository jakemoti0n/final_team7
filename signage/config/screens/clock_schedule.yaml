# 화면 A — 날짜·시각·행사 (PPT 3페이지)
# 좌표는 1920×1080 설계 기준 [x, y, 너비, 높이] (px). rect_rel은 상자 안의 비율 [x, y, w, h].
# 색은 app.yaml theme 이름(text, accent, muted ...) 또는 "#RRGGBB".
# font: size(px), weight(normal|medium|bold), min_size(넘치면 여기까지 줄임), family(생략 시 theme),
#       wrap(wrap_first: 줄바꿈 먼저 | shrink_first: TXT 줄바꿈을 지키고 글자를 먼저 줄임)
# 이 파일에 빠진 항목은 프로그램 기본값을 쓴다. 저장하면 몇 초 안에 반영된다.

date:
  rect: [96, 60, 860, 200]
  font: {size: 140, weight: bold}
  align: left
  color: text
  format: '{year}-{month:02d}-{day:02d}'
time:
  rect: [964, 60, 860, 200]
  font: {size: 140, weight: bold}
  align: right
  color: text
  format: '{ampm} {hour12}:{minute:02d}'
divider:
  show: true
  rect: [96, 290, 1728, 6]
  color: accent
status_label:
  rect: [96, 330, 1728, 110]
  font: {size: 72, weight: bold}
  align: center
  color: accent
  ongoing_text: content/text/schedule_ongoing_label.txt
  upcoming_text: content/text/schedule_upcoming_label.txt
event:
  rect: [96, 450, 1728, 570]
  font: {size: 140, weight: bold, min_size: 56}
  align: center
  color: text
  line_format: '{when}{start} – {title}{location_part}'
  location_format: ' ({location})'
  time_format: '{ampm} {hour12}:{minute:02d}'
  when_today: ''
  when_tomorrow: '내일 '
  when_other: '{month}월 {day}일({weekday}) '
empty:
  text: content/text/schedule_empty.txt
  font: {size: 110, weight: bold, min_size: 56}
  color: muted
