# Automaton 하단 디스플레이 설정. 상대 경로는 signage/ 기준이며 signage/ 밖은 가리킬 수 없다.
# 숫자(12초, 15초, 120초, 600초, 20건, 80%)는 PRD v0.2의 제안값이다. 운영하면서 조정한다.
# 실행 중 바꾸면 rotation / theme / content는 다음 갱신 주기(content.reload_interval_seconds)에 반영되고,
# 나머지(mode, 데이터 공급원 등)는 재시작해야 반영된다.

app:
  locale: ko-KR
  timezone: Asia/Seoul
  mode: production                 # production | demo  (demo: Mock 허용 + DEMO 표시)

display:
  fullscreen: true
  width: 1920                      # 설계 좌표. 실제 출력 해상도가 달라도 비율 유지로 맞춘다
  height: 1080
  orientation: landscape
  scale_mode: keep_aspect_ratio
  hide_cursor: true
  window_size: [960, 540]          # --windowed일 때 처음 창 크기

rotation:                          # 이 순서로 반복. id를 빼면 그 화면은 안 나온다
  - {id: clock_schedule, duration_seconds: 12}
  - {id: bin_status,     duration_seconds: 12}
  - {id: eco_feedback,   duration_seconds: 12}

content:
  reload_interval_seconds: 3       # TXT·이미지·YAML 변경 확인 주기

theme:                             # PPT 테마 색: 흰 바탕, 검정 글자, 초록 강조(accent1 #1EBE9B)
  background: "#FFFFFF"
  text: "#000000"
  accent: "#1EBE9B"
  muted: "#7A8585"
  letterbox: "#000000"             # 화면 비율이 16:9가 아닐 때 남는 여백 색
  demo_badge: "#FB7365"
  font_dir: assets/fonts           # 여기 넣은 .ttf/.otf는 자동 등록된다
  font_families: ["Pretendard", "Noto Sans CJK KR", "NanumGothic", "Noto Sans KR"]   # 있는 첫 글꼴 사용

schedule:
  adapter: excel
  file: data/events.xlsx
  sheet: Events
  reload_interval_seconds: 15
  max_visible_events: 1

bin_status:
  adapter: json                    # mock | json | http   (ros2 | mqtt는 후속 개발)
  file: data/bin_status.json
  url: null                        # adapter: http일 때
  refresh_interval_seconds: 2
  max_data_age_seconds: 120        # 관측 후 이 시간이 지나면 '정보 없음'

eco_feedback:
  adapter: json                    # mock | json | http   (ros2 | mqtt는 후속 개발)
  file: data/eco_metrics.json
  url: null
  refresh_interval_seconds: 5
  max_data_age_seconds: 600        # 집계 후 이 시간이 지나면 판정 안 함(initial)
  evaluation_window_hours: 24      # 평가 창이 이보다 길면 판정 안 함
  min_verified_samples: 20         # 검증 건수가 이보다 적으면 initial + '평가 준비 중'
  positive_threshold_percent: 80   # 테스트용 초기값. 최종 정책 아님
  default_state: initial

mock_data:                         # adapter: mock일 때만 사용
  allowed_only_in_demo_mode: true  # production에서 mock을 고르면 거부하고 '정보 없음'
  visible_demo_badge: true
  bin_status:
    cycle_seconds: 36              # 시나리오가 여럿이면 이 간격으로 다음 것으로
    scenarios:
      - {general: 60, recycling: 10}
  eco_metrics:
    cycle_seconds: 36
    scenarios:                     # 시연에서 나무 3상태를 차례로 보여 준다
      - {verified_correct_count: 18, verified_total_count: 20}   # 90% → positive
      - {verified_correct_count: 14, verified_total_count: 20}   # 70% → negative
      - {verified_correct_count: 9,  verified_total_count: 10}   # 표본 부족 → initial

logging:
  level: INFO
  file: logs/signage.log
  max_bytes: 1000000
  backup_count: 5
